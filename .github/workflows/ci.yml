name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  checks:
    name: Python 3.12+ checks
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true

      - name: Install Python
        run: uv python install

      - name: Sync dependencies
        run: uv sync --locked

      - name: Show tool versions
        run: |
          uv run python --version
          uv run python -c "import pydantic; print(f'pydantic {pydantic.__version__}')"
          uv run ruff --version
          uv run pyrefly --version

      - name: Validate skill package
        run: uv run python scripts/validate_package.py

      - name: Check Kamae policy
        run: uv run python skills/kamae-py/scripts/check_kamae_policy.py --include-tests --strict

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Lint
        run: uv run ruff check .

      - name: Type check
        run: uv run pyrefly check .

      - name: Test
        run: uv run pytest

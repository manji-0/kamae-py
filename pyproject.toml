[project]
name = "kamae-py"
version = "0.3.0"
description = "Kamae Python skill for server-side Python domain modeling with Pydantic v2"
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = "MIT"
dependencies = [
    "pydantic>=2,<3",
]

[dependency-groups]
dev = [
    "pyrefly>=1.1.1",
    "pytest>=9.0.0",
    "pyyaml>=6.0.2",
    "ruff>=0.14.0",
]

[tool.pyrefly.errors]
redundant-cast = "warn"

[tool.uv]
package = false

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF"]

[tool.pyrefly]
project-includes = [
    "scripts",
    "skills/kamae-py/references/taxi-request.py",
    "skills/kamae-py/scripts",
    "tests",
]
project-excludes = ["**/skills/kamae-py/assets/templates/"]
python-version = "3.12.0"

[project]
name = "kamae-py"
version = "0.1.0"
description = "Kamae Python skill for server-side Python domain modeling with Pydantic v2"
readme = "README.md"
requires-python = ">=3.13.14,<3.14"
license = "MIT"
dependencies = [
    "pydantic>=2,<3",
]

[dependency-groups]
dev = [
    "mypy>=1.19.0",
    "pytest>=9.0.0",
    "pyyaml>=6.0.2",
    "ruff>=0.14.0",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF"]

[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["pydantic.mypy"]
files = [
    "scripts",
    "skills/kamae-py/references/taxi-request.py",
    "skills/kamae-py/scripts",
    "tests",
]
exclude = ["^skills/kamae-py/assets/templates/"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

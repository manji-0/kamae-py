[project]
name = "your-project"
version = "0.1.0"
description = "Server-side Python domain project"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "pydantic>=2,<3",
]

[dependency-groups]
dev = [
    "pyrefly>=1.1.1",
    "pytest>=9.0.0",
    "ruff>=0.14.0",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF"]

[tool.pyrefly]
project-includes = ["src", "tests"]
project-excludes = ["**/skills/**/assets/templates/**"]
python-version = "3.12.0"
